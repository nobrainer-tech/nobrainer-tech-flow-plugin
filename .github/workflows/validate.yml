name: Verify native distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The copy and the canonical verifier sit in separate folders, so the verifier's
      # file-type rule never sees its own script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: copy
          persist-credentials: false
      # Pinned to the canonical commit whose verifier allows a file without an extension only
      # as a license, readme or .gitignore; the v2.12.0 tag still has the looser rule. At the
      # next release export, go back to the tag that SOURCE.json names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nobrainer-tech/nobrainer-tech-flow
          ref: b48f15cb78fc2aa5cd97a2e772db00b6b805cdeb
          path: canonical
          persist-credentials: false
          sparse-checkout: scripts/verify_native_export.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -I canonical/scripts/verify_native_export.py copy
